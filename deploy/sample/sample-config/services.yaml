- Fleet:
    - Server list:
        href: https://localhost:8443/mock/servers
        description: Dynamic list with three fictional servers
        widget:
          type: customapi
          url: http://mock-services:8090/mock/api/servers
          display: dynamic-list
          mappings:
            items: data
            name: name
            label: status
            limit: 5
            format: text
            target: https://localhost:8443/mock/server/{id}
    - Embedded status page:
        href: https://localhost:8443/mock/status
        description: Native IFrame widget · same-origin mock page
        widget:
          type: iframe
          name: Demo status
          src: https://localhost:8443/mock/status
          classes: h-60
          allowScrolling: 'yes'
          referrerPolicy: same-origin
- Widget laboratory:
    - Backup detail list:
        href: https://localhost:8443/mock/backups
        description: Custom API list display and relative date
        widget:
          type: customapi
          url: http://mock-services:8090/mock/api/backups
          display: list
          mappings:
            - field: state
              label: Backup state
              additionalField:
                field: lastRun
                format: relativeDate
                color: theme
            - field: jobs
              label: Scheduled jobs
              format: number
    - Two widgets on one card:
        href: https://localhost:8443/mock/home
        description: Documented widgets array with independent mappings
        widgets:
          - type: customapi
            url: http://mock-services:8090/mock/api/home
            mappings:
              - field: watts
                label: Power
                format: float
                scale: 0.001
                suffix: ' kW'
          - type: customapi
            url: http://mock-services:8090/mock/api/photos
            mappings:
              - field: users
                label: Photo users
                format: number
    - Remapped health:
        href: https://localhost:8443/mock/status
        description: Custom API remap and fallback rules
        widget:
          type: customapi
          url: http://mock-services:8090/mock/api/health
          mappings:
            - field: offline
              label: Outage state
              remap:
                - value: 0
                  to: All available
                - any: true
                  to: Check services
- Failure example:
    - Intentional outage:
        href: https://localhost:8443/mock/status
        description: Expected 503 response; expand to inspect widget errors
        siteMonitor: http://mock-services:8090/mock/api/error
        statusStyle: basic
        widget:
          type: customapi
          url: http://mock-services:8090/mock/api/error
          mappings:
            - field: state
              label: Unavailable
- Demo tools:
    - Send sample notification:
        href: https://localhost:8443/mock/notifications

- Home overview:
    - Home automation:
        href: https://localhost:8443/mock/home
        description: Fictional home metrics · Custom API
        siteMonitor: http://mock-services:8090/mock/health
        widget:
          type: customapi
          url: http://mock-services:8090/mock/api/home
          mappings:
            - field: people
              label: People home
              format: number
            - field: lights
              label: Lights on
              format: number
            - field: switches
              label: Switches on
              format: number
    - Energy and comfort:
        href: https://localhost:8443/mock/energy
        description: Fictional energy and temperature · Custom API
        widget:
          type: customapi
          url: http://mock-services:8090/mock/api/home
          mappings:
            - field: watts
              label: Power
              format: number
              suffix: ' W'
            - field: temperature
              label: Temperature
              format: float
              suffix: ' °C'
            - field: energyKwh
              label: Today
              format: float
              suffix: ' kWh'
    - Service health:
        href: https://localhost:8443/mock/status
        description: Fictional health summary · Custom API
        widget:
          type: customapi
          url: http://mock-services:8090/mock/api/health
          mappings:
            - field: healthy
              label: Healthy
              format: number
            - field: degraded
              label: Degraded
              format: number
            - field: offline
              label: Offline
              format: number
- Today:
    - Monthly calendar:
        href: https://localhost:8443/mock/events.ics
        description: Native Calendar widget with a generated iCal feed
        widget:
          type: calendar
          view: monthly
          showTime: true
          timezone: America/Los_Angeles
          integrations:
            - type: ical
              name: Lab calendar
              url: http://mock-services:8090/mock/events.ics
              color: teal
              params:
                showName: true
    - Agenda:
        href: https://localhost:8443/mock/events.ics
        description: Native agenda view of the same generated iCal feed
        widget:
          type: calendar
          view: agenda
          maxEvents: 5
          showTime: true
          previousDays: 1
          timezone: America/Los_Angeles
          integrations:
            - type: ical
              name: Upcoming
              url: http://mock-services:8090/mock/events.ics
              color: cyan

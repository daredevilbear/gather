# Optional populated local fixture over the repaired/pinned Compose services.
name: gather-docs-lab
services:
  gather:
    container_name: gather-docs-lab-dashboard
    # Demo OIDC uses the same HTTPS origin inside and outside Docker.
    entrypoint: [sh, -c, "node /mock/tls-relay.cjs & exec /usr/local/bin/docker-entrypoint.sh node /app/system/bootstrap.cjs"]
    environment:
      NODE_EXTRA_CA_CERTS: /local-ca/root.crt
    volumes:
      - ./certs:/local-ca:ro
      - ./mock:/mock:ro
    depends_on:
      mock-services:
        condition: service_healthy
  notifications:
    container_name: gather-docs-lab-notifications
  system-controller:
    container_name: gather-docs-lab-controller
    read_only: true
    command: [--root, /system-data, --app, gather-docs-lab-dashboard, --notification, gather-docs-lab-notifications, --gateway, gather-docs-lab-gateway]
  gateway:
    container_name: gather-docs-lab-gateway
    ports: !override
      - "127.0.0.1:8443:8443"
    # Start early to create its CA; backends join as they become healthy.
    depends_on: !reset {}
  initialize:
    environment:
      GATHER_EXTERNAL_URL: https://localhost:8443
      GATHER_OIDC_NAME: Demo accounts
  mock-services:
    image: ${GATHER_IMAGE:?Select the released initializer image}
    container_name: gather-docs-lab-mocks
    restart: unless-stopped
    user: "1001:1001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: [node, /mock/server.cjs]
    volumes:
      - ./mock:/mock:ro
      - ./private/ntfy-publisher-password:/run/secrets/ntfy-publisher-password:ro
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8090/mock/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
  seed-notifications:
    image: ${GATHER_IMAGE:?Select the released initializer image}
    profiles: [setup]
    user: "1001:1001"
    entrypoint: [node, /mock/seed-notifications.cjs]
    volumes:
      - ./mock:/mock:ro
      - ./private/ntfy-publisher-password:/run/secrets/ntfy-publisher-password:ro
networks:
  default:
    # Docker's automatic pool reached 192.168.0.0/20 and overlapped the LAN.
    # Reserve this unused subnet explicitly for the local lab.
    ipam:
      config:
        - subnet: 172.16.240.0/24
          gateway: 172.16.240.1
volumes:
  caddy-data:
  caddy-config:

configs:
  gateway:
    content: |
      # Local-only adaptation. Both names use Caddy's local CA.
      https://localhost:8443, https://gateway:443 {
        tls internal
        handle /oidc/* {
          reverse_proxy mock-services:8090
        }
        handle /mock/* {
          reverse_proxy mock-services:8090
        }
        handle /gather-notifications/* {
          reverse_proxy notifications:8080
        }
        handle {
          reverse_proxy gather:3000
        }
      }

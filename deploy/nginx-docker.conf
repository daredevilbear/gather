# Mount in /etc/nginx/conf.d/default.conf. Requires nginx >= 1.27.3.
# Docker's embedded DNS refreshes recreated service addresses without a reload.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 3s;
upstream gather_app {
    zone gather_app 64k;
    server gather:3000 resolve;
}
upstream gather_notifications {
    zone gather_notifications 64k;
    server notifications:8080 resolve;
}
server {
    listen 8080;
    server_name _;
    client_max_body_size 2m;
    location /gather-notifications/ {
        proxy_pass http://gather_notifications;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        proxy_pass http://gather_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}

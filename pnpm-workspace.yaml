packages:
  - .

# Patch the minimatch transitive dependency (GHSA-q2hr-2g5m-vwhr,
# GHSA-qhr7-859c-m2p7, GHSA-6j4f-fj2g-mc7p) without changing legacy v1 users.
overrides:
  "brace-expansion@>=4.0.0 <5.0.12": 5.0.12
  # Patch indexed source-map denial of service (GHSA-68fv-2mgg-jv7q).
  "source-map-js@>=1.0.0 <1.2.2": 1.2.2
  # Patch Vite development-server and bundled launch-editor vulnerabilities.
  "vite@>=8.2.0 <8.2.4": 8.2.4
  # Patch fetch and EventSource denial of service (GHSA-xjj6-f33q-929c,
  # GHSA-4qv8-2p9j-2685) for Kubernetes and jsdom's transitive Undici users.
  "undici@>=8.0.0 <8.12.2": 8.12.2
  # Bound IPv6 zone parsing in the Kubernetes client's SOCKS dependencies.
  "ip-address@>=10.0.0 <10.7.4": 10.7.4
  # Bound oversized collection validation in development lint dependencies.
  "zod@>=4.0.0 <4.6.6": 4.6.6

allowBuilds:
  "@tailwindcss/oxide": true
  core-js: false
  cpu-features: false
  esbuild: false
  osx-temperature-sensor: true
  protobufjs: false
  sharp: true
  ssh2: false
  unrs-resolver: true

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - osx-temperature-sensor
  - protobufjs
  - sharp

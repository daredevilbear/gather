name: Test and publish containers

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish images from main or dev after validation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Application and security tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release versions and license notices
        run: |
          python3 scripts/ci/check-release.py
          python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Run complete application suite
        run: pnpm exec vitest run --pool forks --maxWorkers=4
      - name: Test recovery transactions and push worker
        run: |
          python3 -m unittest discover -s system -p 'test_*.py'
          node notifications/test-worker.cjs
      - name: Test notification image and encrypted SQLite loader
        run: |
          docker build -t gather-notifications:test notifications
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,noexec \
            -v "$PWD/notifications:/tests:ro" -w /tests gather-notifications:test \
            python -B -m unittest discover -s tests -p 'test*.py'
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,noexec \
            -v "$PWD/notifications:/tests:ro" -w /tests gather-notifications:test \
            python -B -m unittest test_vault

  build:
    name: Build ${{ matrix.name }}
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            context: .
          - name: notifications
            context: notifications
          - name: system-controller
            context: system
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Read image version
        id: release
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          load: true
          push: false
          tags: gather-ci:${{ matrix.name }}
          build-args: |
            REVISION=${{ github.sha }}
            VERSION=${{ steps.release.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Smoke-test app startup and health
        if: matrix.name == 'app'
        run: bash scripts/ci/smoke-container.sh gather-ci:app

  publish:
    name: Publish ${{ matrix.image }}
    needs: [tests, build]
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gather
            context: .
            cache: app
          - image: gather-notifications
            context: notifications
            cache: notifications
          - image: gather-system-controller
            context: system
            cache: system-controller
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify publication branch
        run: |
          case "$GITHUB_REF" in
            refs/heads/dev) target=origin/dev ;;
            refs/heads/main|refs/tags/v*) target=origin/main ;;
            *) echo "Unsupported publication ref: $GITHUB_REF" >&2; exit 1 ;;
          esac
          git merge-base --is-ancestor "$GITHUB_SHA" "$target"
          if [[ "$GITHUB_REF" == refs/heads/* ]]; then
            [[ "$(git rev-parse "$target")" == "$GITHUB_SHA" ]] || { echo "Refusing to publish a stale branch revision" >&2; exit 1; }
          fi
          python3 scripts/ci/check-release.py
      - name: Read image version
        id: release
        run: |
          version="$(cat VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/heads/dev ]]; then version=dev; fi
          echo "build_version=$version" >> "$GITHUB_OUTPUT"
          echo "created=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - name: Normalize registry namespace
        id: registry
        env:
          OWNER: ${{ github.repository_owner }}
        run: printf 'owner=%s\n' "${OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check immutable source image
        id: existing
        env:
          IMAGE: ghcr.io/${{ steps.registry.outputs.owner }}/${{ matrix.image }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" > /tmp/source-image.txt 2>/tmp/source-image-error.txt; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -Eiq 'manifest unknown|not found|404' /tmp/source-image-error.txt; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/source-image-error.txt >&2
            exit 1
          fi
      - name: Promote verified source digest to release or channel tags
        if: startsWith(github.ref, 'refs/tags/') || steps.existing.outputs.exists == 'true'
        env:
          IMAGE: ghcr.io/${{ steps.registry.outputs.owner }}/${{ matrix.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: bash scripts/ci/promote-image.sh
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        if: ${{ !startsWith(github.ref, 'refs/tags/') && steps.existing.outputs.exists != 'true' }}
        with:
          images: ghcr.io/${{ steps.registry.outputs.owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,format=long,prefix=sha-
          flavor: latest=false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-3.0
            org.opencontainers.image.version=${{ steps.release.outputs.build_version }}
            org.opencontainers.image.created=${{ steps.release.outputs.created }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: image
        if: ${{ !startsWith(github.ref, 'refs/tags/') && steps.existing.outputs.exists != 'true' }}
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REVISION=${{ github.sha }}
            VERSION=${{ steps.release.outputs.build_version }}
            BUILDTIME=${{ steps.release.outputs.created }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}
      - name: Verify published source labels and attestations
        id: verify
        env:
          IMAGE: ghcr.io/${{ steps.registry.outputs.owner }}/${{ matrix.image }}
          VERSION: ${{ steps.release.outputs.build_version }}
        run: |
          mkdir -p release-metadata
          docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{json .Image}}' > release-metadata/image-config.json
          docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{json .Provenance}}' > release-metadata/provenance.json
          docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{json .SBOM}}' > release-metadata/sbom.json
          docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --raw > release-metadata/manifest.json
          digest="$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{.Manifest.Digest}}')"
          printf '%s@%s\n' "$IMAGE" "$digest" > release-metadata/image.txt
          python3 scripts/ci/verify-image.py release-metadata/image-config.json release-metadata/provenance.json release-metadata/sbom.json
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')" == "$digest" ]]
            [[ "$(docker buildx imagetools inspect "$IMAGE:${VERSION%.*}" --format '{{.Manifest.Digest}}')" == "$digest" ]]
          fi
      - name: Save verified image metadata for release review
        if: ${{ !cancelled() && steps.verify.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata-${{ matrix.image }}
          path: release-metadata/
          if-no-files-found: error
          retention-days: 30
      - name: Record package visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ steps.registry.outputs.owner }}
          PACKAGE: ${{ matrix.image }}
        run: gh api "users/$OWNER/packages/container/$PACKAGE" --jq '{name, visibility, html_url}'
      - name: Record immutable image digest
        if: steps.image.outcome == 'success'
        env:
          IMAGE: ghcr.io/${{ steps.registry.outputs.owner }}/${{ matrix.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: printf '%s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

name: Bug report
description: Report a reproducible Gather problem with sanitized details.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Check the Gather troubleshooting guide and search existing issues.
        Remove credentials, cookies, private hostnames, and user data.
        Use SECURITY.md for confidential vulnerability reports.
  - type: input
    id: version
    attributes:
      label: Gather image version and source revision
      placeholder: "1.0.0 (sha-...)"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Sanitized configuration, logs, and environment
      description: Include installation method, browser/device, and relevant service versions.
